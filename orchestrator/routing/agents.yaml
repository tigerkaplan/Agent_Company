      - source_collection
      - verification
      - comparison
      - synthesis
  reviewer:
    role: ../../agents/reviewer/ROLE.md
    guardrails: ../../agents/reviewer/GUARDRAILS.md
    memory: ../../agents/reviewer/MEMORY.md
